# Render Blueprint — backend + Postgres, both provisioned together.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Fields
# marked "sync: false" need a value typed in by hand after the first deploy
# (Render will prompt for them) — see docs/deployment.md and the chat
# instructions for exactly what goes in each one.
databases:
  - name: stylesignal-db
    plan: starter
    databaseName: stylesignal
    user: stylesignal

services:
  - type: web
    name: stylesignal-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt "psycopg[binary]>=3.1" "boto3>=1.34"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: STYLESIGNAL_ENV
        value: production
      - key: STYLESIGNAL_JWT_SECRET
        generateValue: true

      # Postgres — Render's auto-generated connection string uses the
      # postgresql:// scheme (psycopg2's default); this app is built for
      # psycopg 3 and needs the scheme changed to postgresql+psycopg://.
      # Paste Render's "External Connection String" here with that one edit.
      - key: STYLESIGNAL_DATABASE_URL
        sync: false

      # Cloudflare R2 (S3-compatible) — from your existing Cloudflare account.
      - key: STYLESIGNAL_STORAGE_BACKEND
        value: s3
      - key: STYLESIGNAL_S3_BUCKET
        sync: false
      - key: STYLESIGNAL_S3_REGION
        value: auto
      - key: STYLESIGNAL_S3_ENDPOINT_URL
        sync: false
      - key: STYLESIGNAL_S3_SSE
        value: ""
      # boto3 reads these two directly — they're the R2 API token's
      # Access Key ID / Secret Access Key, not a StyleSignal-specific field.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # VLM
      - key: STYLESIGNAL_ANTHROPIC_API_KEY
        sync: false
      - key: STYLESIGNAL_VLM_MODEL
        value: claude-opus-5

      # Email (Resend) — same account already wired up locally.
      - key: STYLESIGNAL_EMAIL_BACKEND
        value: resend
      - key: STYLESIGNAL_RESEND_API_KEY
        sync: false
      - key: STYLESIGNAL_EMAIL_FROM
        value: "StyleSignal <onboarding@resend.dev>"

      # Product config carried over from local .env.
      - key: STYLESIGNAL_FREE_MONTHLY_SCANS
        value: "50"
      - key: STYLESIGNAL_COMMUNITY_ENABLED
        value: "true"
